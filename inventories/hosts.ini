---
# Минимальный "плоский" инвентарь в классическом формате — для быстрого теста
# одной командой без дерева каталогов:
#   ansible -i inventories/hosts.ini lamp -m ping -u admin -k
#
# Актуальные окружения описаны в inventories/dev/ и inventories/prod/ (YAML).

[lamp:children]
webservers
dbservers

[webservers]
wp01 ansible_host=192.168.56.10 ansible_user=admin

[dbservers]
wp01 ansible_host=192.168.56.10 ansible_user=admin

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519
