---
# Инвентарь PROD-окружения.
# Запуск: ansible-playbook -i inventories/prod playbooks/site.yml --ask-vault-pass
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    lamp:
      children:
        webservers:
          hosts:
            wp-prod-01:
              ansible_host: 203.0.113.27
              wordpress_env: production
        dbservers:
          hosts:
            wp-prod-01:
      vars:
        ansible_user: deploy
        ansible_port: 22
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        # Секреты берём из зашифрованного файла group_vars/vault.yml
        # (создаётся командой ansible-vault, см. docs/RUNBOOK.md).
