---
# Инвентарь для развёртывания внутри WSL2 (Debian).
# Управляющий узел и целевая система — один и тот же Debian-хост, поэтому
# используется ansible_connection=local: плейбук выполняется локально, через
# sudo, без SSH. Это полностью совместимо с остальными ролями и плейбуками.
#
#   ansible-playbook -i inventories/wsl playbooks/site.yml
#
# Если нужен именно SSH-вариант (Windows -> WSL), см. inventories/wsl/hosts-ssh.yml
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
  children:
    lamp:
      children:
        webservers:
          hosts:
            wp-wsl:
        dbservers:
          hosts:
            wp-wsl:
      vars:
        # Пользователь берётся автоматически (ansible_env.USER недоступен при
        # local-подключении до сбора фактов), поэтому оставляем значение по
        # умолчанию из окружения и полагаемся на sudo NOPASSWD.
        ansible_become: true
