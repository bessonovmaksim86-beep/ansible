all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    lamp:
      children:
        webservers:
          hosts:
            wp01:
              ansible_host: 192.168.56.10
        dbservers:
          hosts:
            wp01:
      vars:
        ansible_user: admin
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
